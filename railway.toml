[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "/apps/api/**",
  "/packages/**",
  "/railway.toml",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
]

[deploy]
startCommand = "pnpm start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
